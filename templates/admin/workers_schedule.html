{% extends 'admin/admin_dashboard.html' %}
{% block content %}

<div class="container py-4">

    <!-- Top Bar with Back Button -->
    <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white shadow-sm rounded-4">

        <a href="{% url 'admin_dashboard' %}" class="btn btn-light border rounded-pill px-4">
            ← Back
        </a>

        <h5 class="mb-0 fw-bold text-primary">Workers Schedule </h5>



    </div>

    <!-- Table Card -->
    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">
                <table class="table table-hover align-middle text-center mb-0">

                    <thead class="table-primary">
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Name</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for i in data %}
                        <tr>
                            <td class="fw-semibold">{{ i.date }}</td>
                            <td>{{ i.time }}</td>
                            <td>{{i.user.name}}</td>

                        </tr>
                        {% empty %}
                        <tr>
                            <td colspan="3" class="text-muted py-4">
                                No availability found
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</div>

{% endblock %}
