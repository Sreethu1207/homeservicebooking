{% extends 'admin/admin_dashboard.html' %}
{% block content %}

<div class="container py-4">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded-4">

        <a href="{% url 'admin_view_complaints' %}" class="btn btn-light border rounded-pill px-4">
            ← Back
        </a>

        <h5 class="mb-0 fw-bold text-primary">Support Ticket</h5>

        <div></div>

    </div>

    <!-- Ticket Card -->
    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-4">

            <!-- Ticket Header -->
            <div class="d-flex justify-content-between align-items-center mb-3">

                <div>
                    <h6 class="fw-bold mb-1">{{ data.name }}</h6>
                    <small class="text-muted">
                        {{ data.date }}
                    </small>
                </div>

                <span class="badge bg-danger px-3 py-2">
                    Pending Reply
                </span>

            </div>

            <hr>

            <!-- Complaint Box -->
            <div class="mb-4 p-3 bg-light rounded-3 border">

                <h6 class="text-muted mb-2">Complaint</h6>
                <p class="mb-0">
                    {{ data.complaint }}
                </p>

            </div>

            <!-- Reply Form -->
            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Your Reply</label>
                    <textarea class="form-control rounded-3" name="reply" rows="4"
                              placeholder="Write your response to the user..."></textarea>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                    Send Reply
                </button>

            </form>

            <!-- Messages -->
            {% for message in messages %}
                <div class="alert alert-info mt-3 rounded-3">
                    {{ message }}
                </div>
            {% endfor %}

        </div>

    </div>

</div>

{% endblock %}
