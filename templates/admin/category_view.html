{% extends 'admin/admin_dashboard.html' %}
{% block content %}

<div class="container py-4">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white shadow-sm rounded-4">

        <a href="{% url 'admin_dashboard' %}" class="btn btn-light border rounded-pill px-4">
            ← Back
        </a>

        <h5 class="mb-0 fw-bold text-primary">Service Categories</h5>

        <div></div>

    </div>

    <!-- Card Table -->
    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle text-center mb-0">

                    <thead class="table-primary">
                        <tr>
                            <th>Service Category</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for i in data %}
                        <tr>

                            <td class="fw-semibold">
                                {{ i.category }}
                            </td>

                            <td>

                                <a href="{% url 'category_delete' i.id %}"
                                   class="btn btn-sm btn-outline-danger rounded-pill px-3 me-2">
                                    Delete
                                </a>

                                <a href="{% url 'admin_service_filter' i.id %}"
                                   class="btn btn-sm btn-outline-primary rounded-pill px-3">
                                    Workers
                                </a>

                            </td>

                        </tr>

                        {% empty %}
                        <tr>
                            <td colspan="2" class="text-muted py-4">
                                No categories available
                            </td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
