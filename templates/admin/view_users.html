{% extends 'admin/admin_dashboard.html' %}
{% block content %}

<div class="container py-4">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-4 p-3 bg-white shadow-sm rounded-4">

        <a href="{% url 'admin_dashboard' %}" class="btn btn-light border rounded-pill px-4">
            ← Back
        </a>

        <h5 class="mb-0 fw-bold text-primary">Users</h5>

        <div></div>

    </div>

    <!-- Card -->
    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-4">

            <div class="table-responsive">

                <table class="table table-hover align-middle text-center mb-0">

                    <thead class="table-primary">
                        <tr>
                            <th>Username</th>
                            <th>Name</th>
                            <th>Address</th>
                            <th>Contact</th>
                        </tr>
                    </thead>

                    <tbody>

                        {% for i in data %}
                        <tr>

                            <td class="fw-semibold text-primary">
                                {{ i.user.username }}
                            </td>

                            <td>{{ i.name }}</td>

                            <td class="text-muted">
                                {{ i.address }}
                            </td>

                            <td>
                                <span class="badge bg-secondary px-3 py-2 rounded-pill">
                                    {{ i.contact }}
                                </span>
                            </td>

                        </tr>

                        {% empty %}
                        <tr>
                            <td colspan="4" class="text-muted py-4">
                                No users found
                            </td>
                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
