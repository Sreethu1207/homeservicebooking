{% extends 'admin/admin_dashboard.html' %}
{% block content %}
{% load crispy_forms_tags %}

<div class="container py-4">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white shadow-sm rounded-4">

        <a href="{% url 'admin_dashboard' %}" class="btn btn-light border rounded-pill px-4">
            ← Back
        </a>

        <h5 class="mb-0 fw-bold text-primary">Add Service category</h5>

        <div></div>

    </div>

    <!-- Floating Card -->
    <div class="row justify-content-center">

        <div class="col-xl-6 col-lg-7 col-md-9">

            <div class="card border-0 shadow-lg rounded-5">

                <!-- Card Body -->
                <div class="card-body p-5">

                    <!-- Messages -->
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-info alert-dismissible fade show rounded-3">
                                {{ message }}
                                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <!-- Form -->
                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-3">
                            {{ form|crispy }}
                        </div>

                        <button type="submit"
                                class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                            Save
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
