{% extends 'user/user_dashboard.html' %}
{% block content %}

<div class="container mt-4">

    <!-- Heading -->
    <div class="text-center mb-4">
        <h3 class="text-primary">⭐ Give Your Review</h3>
        <p class="text-muted">Share your experience about the service</p>
    </div>

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0 rounded-4 p-4">

                <!-- Worker Info -->
                <div class="mb-3 text-center">
                    <h5 class="text-dark">
                        Worker: {{ booking.worker.name }}
                    </h5>
                    <small class="text-muted">
                        {{ booking.worker.category }}
                    </small>
                </div>

                <form method="post">
                    {% csrf_token %}

                    <!-- Rating -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Rating</label>
                        <select name="rating" class="form-select rounded-3" required>
                            <option value="">Select Rating</option>
                            <option value="5">Excellent</option>
                            <option value="4"> Good</option>
                            <option value="3"> Average</option>
                            <option value="2"> Poor</option>
                            <option value="1"> Very Bad</option>
                        </select>
                    </div>

                    <!-- Review -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Review</label>
                        <textarea name="review"
                                  class="form-control rounded-3"
                                  rows="4"
                                  placeholder="Write your feedback here..."
                                  required></textarea>
                    </div>

                    <!-- Submit -->
                    <div class="text-center mt-3">
                        <button type="submit"
                                class="btn btn-success rounded-pill px-4">
                            Submit Review
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
