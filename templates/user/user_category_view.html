{% extends 'user/user_dashboard.html' %}
{% block content %}

<div class="container mt-4">

    <!-- HEADER + BACK BUTTON -->
    <div class="d-flex align-items-center justify-content-between mb-4">

        <!-- Back Button -->
        <a href="{% url 'user_dashboard' %}"
           class="btn btn-outline-primary btn-sm px-3 shadow-sm">
            <i class="fa fa-arrow-left me-1"></i> Back
        </a>

        <!-- Title -->
        <h4 class="mb-0 fw-bold text-primary">
            Available Services
        </h4>

        <!-- Spacer (for alignment balance) -->
        <div style="width:80px;"></div>

    </div>

    <!-- CARDS -->
    <div class="row g-4">

        {% for i in data %}
        <div class="col-md-4 col-sm-6">

            <div class="card border-0 shadow-sm h-100 text-center"
                 style="border-radius: 15px; transition: 0.3s;">

                <div class="card-body d-flex flex-column justify-content-center p-4">

                    <!-- Icon Circle -->
                    <div class="mb-3">
                        <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center mx-auto shadow"
                             style="width:60px;height:60px;font-size:22px;">
                            <i class="fa fa-tools"></i>
                        </div>
                    </div>

                    <!-- Category -->
                    <h5 class="fw-bold mb-3 text-dark">
                        {{ i.category }}
                    </h5>

                    <!-- Button -->
                    <a href="{% url 'service_filter' i.id %}"
                       class="btn btn-primary w-100 rounded-pill shadow-sm">
                        View Workers
                    </a>

                </div>
            </div>

        </div>
        {% endfor %}

    </div>
</div>

{% endblock %}
