{% extends 'worker/worker_dashboard.html' %}
{% block content %}

<div class="container py-4">

    <!-- Top Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3 p-3 bg-white shadow-sm rounded-4">

        <a href="{% url 'worker_dashboard' %}" class="btn btn-light border rounded-pill px-4">
            ← Back
        </a>

        <h5 class="mb-0 fw-bold text-primary">My Profile</h5>

        <div></div>

    </div>

    {% for i in data %}

    <!-- Profile Card -->
    <div class="card border-0 shadow-lg rounded-4">

        <div class="card-body p-4">

            <!-- Profile Header -->
            <div class="text-center mb-4">

                <img src="{{ i.image.url }}"
                     alt="Profile Image"
                     width="120"
                     height="120"
                     class="rounded-circle shadow-sm border"
                     style="object-fit: cover;">

                <h5 class="mt-3 fw-bold">{{ i.name }}</h5>

            </div>

            <!-- Profile Details -->
            <div class="table-responsive">
                <table class="table table-borderless">

                    <tr>
                        <th class="text-muted">Name</th>
                        <td class="fw-semibold">{{ i.name }}</td>
                    </tr>

                    <tr>
                        <th class="text-muted">Address</th>
                        <td>{{ i.address }}</td>
                    </tr>

                    <tr>
                        <th class="text-muted">Contact</th>
                        <td>{{ i.contact }}</td>
                    </tr>

                    <tr>
                        <th class="text-muted">PayPal Email</th>
                        <td>{{ i.paypal_email }}</td>
                    </tr>

                    <tr>
                        <th class="text-muted">Experience</th>
                        <td>{{ i.experience }}</td>
                    </tr>

                </table>
            </div>

            <!-- Action Button -->
            <div class="text-center mt-4">

                <a href="{% url 'update_worker_profile' %}"
                   class="btn btn-primary px-4 rounded-pill">
                    Update Profile
                </a>

            </div>

        </div>
    </div>

    {% endfor %}

</div>

{% endblock %}
