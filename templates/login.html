<!DOCTY<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
        }

        /* LEFT IMAGE */
        .left {
            flex: 1;
            background: url("{% static 'img/loginregistration.jpg' %}") no-repeat center center;
            background-size: cover;
            position: relative;
        }

        .left::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
        }

        .left-content {
            position: relative;
            z-index: 2;
            color: white;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .brand {
            font-size: 34px;
            font-weight: bold;
        }

        /* RIGHT LOGIN AREA */
        .right {
            flex: 1;
            background: linear-gradient(135deg, #eef2f3, #dfe9f3);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        /* GLASS CARD */
        .glass-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 18px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.3);
        }

        @media (max-width: 768px) {
            .left {
                display: none;
            }
        }
    </style>
</head>

<body>

<!-- LEFT SIDE -->
<div class="left">

    <div class="left-content">
        <div class="brand">
            <i class="fa fa-building me-2"></i> APEX
        </div>

        <p class="mt-3">
            Welcome back! Access your dashboard, bookings, and services.
        </p>
    </div>

</div>

<!-- RIGHT SIDE -->
<div class="right">

    <div class="glass-card">

        <!-- BACK BUTTON -->
        <div class="mb-3">
            <a href="{% url 'main_view' %}" class="btn btn-light border rounded-pill px-3">
                ← Back to Home
            </a>
        </div>

        <h4 class="text-center text-primary fw-bold mb-4">
            Login
        </h4>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control rounded-3" name="uname" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control rounded-3" name="pass" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                Login
            </button>
        </form>

        {% for message in messages %}
            <div class="alert alert-primary mt-3">
                {{ message }}
            </div>
        {% endfor %}

        <p class="text-center mt-3 mb-0">
            Don't have an account?
            <a href="{% url 'main_view' %}" class="text-primary">Register</a>
        </p>

    </div>

</div>

</body>
</html>
